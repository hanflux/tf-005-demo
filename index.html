</main>
<dialog id="tutorial"><div class="eyebrow">乱得要命，收得上头！</div><h2>先收哪一个？</h2><p>点物品：上方已开放的分类直接收走，其他物品占一个暂存格。</p><p><b>暂存只有 3 格，第 4 件会爆仓。</b><br>被压住的物品要先移走上层；收满一类就会换新箱。</p><p class="hint">试试先拿纸盒，再拿下面的小火车。</p><button id="start" class="primary">开收！</button></dialog>
<dialog id="result"><div id="result-icon"></div><h2 id="result-title"></h2><p id="result-text"></p><button id="again" class="primary">再收一局</button></dialog>
